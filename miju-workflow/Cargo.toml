[package]
name = "miju-workflow"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sequential task execution and in-memory workflow results for miju"

[features]
default = ["tracing"]
## Emit execution and result-storage tracing events
tracing = ["dep:tracing", "miju-core/tracing"]

[dependencies]
miju-core = { version = "0.1.0", default-features = false, features = ["serde", "shared"] }
miju-codec = { version = "0.1.0" }
dashmap = "6.2.1"
tracing = { version = "0.1.44", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1"
tower = { version = "0.5.3", features = ["util"], default-features = false }
futures-util = { version = "0.3.34", features = ["sink", "std"], default-features = false }
futures-sink = { version = "0.3.34", default-features = false }

[dev-dependencies]
miju-file-storage = { version = "0.1.0" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
