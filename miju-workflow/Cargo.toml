[package]
name = "miju-workflow"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Step context and task metadata for sequential miju workflows"

[dependencies]
miju-core = { version = "0.1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
