on:
  push:
    tags: ["v*"]

name: cargo-publish
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  audit:
    uses: ./.github/workflows/audit.yaml

  publish:
    name: publish-crates
    runs-on: ubuntu-latest
    needs: [test, audit]
    timeout-minutes: 30
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: validate-versions
        id: versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --format-version 1 --no-deps --locked > "$RUNNER_TEMP/release-metadata.json"
          python3 - "$RUNNER_TEMP/release-metadata.json" <<'PY'
          import json, os, sys, urllib.error, urllib.request

          with open(sys.argv[1], encoding="utf-8") as file:
              metadata = json.load(file)
          order = ["miju-core", "miju-codec", "miju-file-storage", "miju-workflow", "miju"]
          packages = {package["name"]: package for package in metadata["packages"]}
          version = packages["miju-core"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              sys.exit(f"Release tag must be v{version}")
          for name in order:
              package = packages[name]
              if package["version"] != version or package["publish"] != ["crates-io"]:
                  sys.exit(f"{name} must be version {version} and publish to crates-io")
          for name, package in packages.items():
              if name not in order and package["publish"] != []:
                  sys.exit(f"{name} must remain unpublished")
              for dependency in package["dependencies"]:
                  target = dependency["name"]
                  if target not in order:
                      continue
                  if (dependency["req"] not in (version, f"^{version}", f"={version}")
                      or dependency.get("path")
                      or dependency["source"] != "registry+https://github.com/rust-lang/crates.io-index"):
                      sys.exit(f"{name}: {target} must use version {version} through the root patch")
                  if name in order and order.index(target) >= order.index(name):
                      sys.exit(f"Publish order must place {target} before {name}")

          # Reruns skip exact versions already indexed; registry errors must fail.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in order:
                  request = urllib.request.Request(
                      f"https://index.crates.io/{name[:2]}/{name[2:4]}/{name}",
                      headers={"User-Agent": "miju-release (https://github.com/nanfeng-labs/miju)"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          entries = [json.loads(line) for line in response.read().splitlines()]
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      entries = []
                  existing = next((entry for entry in entries if entry["vers"] == version), None)
                  if existing is not None and (existing["name"] != name or existing["yanked"]):
                      sys.exit(f"{name} {version}: unexpected or yanked registry entry")
                  state = "published" if existing is not None else "pending"
                  print(f"{name} {version}: {state}")
                  print(f"{name.replace('-', '_')}={state}", file=output)
          PY
      - name: publish miju-core
        if: steps.versions.outputs.miju_core == 'pending'
        run: cargo publish --registry crates-io --locked -p miju-core
      - name: publish miju-codec
        if: steps.versions.outputs.miju_codec == 'pending'
        run: cargo publish --registry crates-io --locked -p miju-codec
      - name: publish miju-file-storage
        if: steps.versions.outputs.miju_file_storage == 'pending'
        run: cargo publish --registry crates-io --locked -p miju-file-storage
      - name: publish miju-workflow
        if: steps.versions.outputs.miju_workflow == 'pending'
        run: cargo publish --registry crates-io --locked -p miju-workflow
      - name: publish miju
        if: steps.versions.outputs.miju == 'pending'
        run: cargo publish --registry crates-io --locked -p miju
