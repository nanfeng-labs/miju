[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Retain the optional Bincode 2.0.1 format pending a maintained replacement; maintenance advisory only." },
]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
