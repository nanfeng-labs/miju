[package]
name = "dynamic-workers"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Constructs workers with generics, enum dispatch, macros, and JSON configuration"

[dependencies]
miju = { version = "0.2.0", default-features = false, features = ["tracing", "catch-panic", "limit", "config"] }
miju-file-storage = "0.2.0"
email-service = { path = "../email-service", version = "0.1.0" }
enum_dispatch = "0.3.13"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
serde_json = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[[bin]]
name = "generics"
path = "src/generics.rs"

[[bin]]
name = "enum-dispatch"
path = "src/enum_dispatch.rs"

[[bin]]
name = "macros"
path = "src/macros.rs"

[[bin]]
name = "from-config"
path = "src/from_config.rs"

[lints]
workspace = true
