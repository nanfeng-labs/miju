[package]
name = "retries"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Demonstrates bounded retries with exponential backoff and abort filtering"

[dependencies]
miju = { version = "0.2.0", default-features = false, features = ["retry", "tracing"] }
email-service = { path = "../email-service", version = "0.1.0" }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[lints]
workspace = true
