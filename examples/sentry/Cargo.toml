[package]
name = "sentry-example"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reports task errors, isolated breadcrumbs, and nested performance spans to Sentry"

[dependencies]
miju = { version = "0.2.0", default-features = false, features = ["sentry", "tracing", "limit"] }
email-service = { path = "../email-service", version = "0.1.0" }
sentry = { version = "0.49.3", default-features = false, features = ["transport"] }
sentry-tower = { version = "0.49.3", default-features = false }
sentry-tracing = { version = "0.49.3", default-features = false }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
sentry = { version = "0.49.3", default-features = false, features = ["test"] }

[lints]
workspace = true
