[package]
name = "unique-jobs"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Demonstrates suppressing duplicate in-memory jobs with an idempotency key"

[dependencies]
miju = { version = "0.1.1", default-features = false, features = ["tracing"] }
email-service = { path = "../email-service", version = "0.1.0" }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[lints]
workspace = true
