[package]
name = "opentelemetry-example"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Exports OpenTelemetry worker metrics through a local Prometheus scrape endpoint"

[dependencies]
miju = { version = "0.1.1", default-features = false, features = ["opentelemetry", "tracing"] }
miju-file-storage = "0.1.1"
email-service = { path = "../email-service", version = "0.1.0" }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "tokio"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = { version = "0.33.1", default-features = false }
prometheus = { version = "0.14.0", default-features = false }
serde = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "net", "rt", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[lints]
workspace = true
