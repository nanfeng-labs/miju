[package]
name = "monitor-context"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Observes live workers through monitor context and a terminal status panel"

[dependencies]
miju = { version = "0.1.0", default-features = false, features = ["tracing", "opentelemetry", "limit", "task-context"] }
miju-file-storage = "0.1.0"
email-service = { path = "../email-service", version = "0.1.0" }
rand = "0.10.3"
tempfile = "3.27.0"
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
