[package]
name = "miju"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Application-facing task processing APIs and worker middleware for miju"
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
# defines the configuration attribute `docsrs`
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["miju-core/default"]
## Limit concurrent tasks and task processing rates
limit = ["tower/limit"]
## Apply timeouts to task execution
timeout = ["tower/timeout"]
## Filter tasks with synchronous or asynchronous predicates
filter = ["tower/filter"]
## Catch unwinding panics during task execution and convert them to errors
catch-panic = ["dep:futures-util"]
## Retry failed tasks immediately or with backoff
retry = ["tower/retry"]
## Trace task processing and emit core lifecycle logs
tracing = ["dep:tracing", "miju-core/tracing"]
## Construct workers and middleware from configuration
config = ["dep:serde"]
## Track and cancel individual running tasks
task-context = ["miju-core/task-context"]
## Share a backend through cloneable handles
shared = ["miju-core/shared"]
## Generate the feature flag reference when building documentation
docsrs = ["dep:document-features"]

[dependencies]
miju-core = { version = "0.1.0", default-features = false }
tower = { version = "0.5.3", features = ["util"], default-features = false }
document-features = { version = "0.2", optional = true }
futures-util = { version = "0.3.34", optional = true, default-features = false }
pin-project = "1"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "time", "test-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }
serde_json = "1.0"

[lints]
workspace = true

[package.metadata.cargo-udeps.ignore]
# Used under cfg(doc) to generate the feature reference; checked by the rustdoc CI job.
normal = ["document-features"]
