[package]
name = "miju-file-storage"
version = "0.2.0"
publish = ["crates-io"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "File-backed task storage with JSON and CSV adapters for miju"
categories = ["database", "filesystem", "asynchronous", "data-structures"]

[dependencies]
miju-core = { version = "0.2.0", default-features = false, features = ["sleep", "serde"] }
miju-codec = { version = "0.2.0", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
futures-sink = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "async-await", "async-await-macro", "std"] }
futures-core = { version = "0.3.34", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
fd-lock = "4.0.4"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
